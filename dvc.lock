            original reportó ceros. El dato real se reenvía 15 días después, cuando
            el pronóstico de esa semana ya fue publicado. Ejercita el INVARIANTE 4:
            la corrección se añade, no sobrescribe, y la vista vigente cambia sin
            perder lo que creíamos antes.\n"
          entrega_original:
            donde:
              store_nbr: 44
            asignar:
              sales: 0.0
        - tipo: fuente_no_llega
          fuente: transactions
          arrival_date: '2017-07-25'
          descripcion: "Caída del sistema de POS central: ese día no hay entrega y
            el archivo se acumula a la del día siguiente. Ejercita el INVARIANTE 5:
            la ausencia de una fuente es una situación de negocio y NO debe hacer
            fallar el DAG.\n"
        origen:
          kaggle_dir: data/kaggle
          landing_dir: landing
          dias_operacion: 46
          corte_historico:
