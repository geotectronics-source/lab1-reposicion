schema: '2.0'
stages:
  bandeja:
    cmd: python tools/build_landing.py --limpiar
    deps:
    - path: data/kaggle
      hash: md5
      md5: bdc16ae394251e429e0116e457456a39.dir
      size: 123397286
      nfiles: 5
    - path: tools/build_landing.py
      hash: md5
      md5: b4b87bbea75fb14b453d1a6fd06924f2
      size: 12614
    params:
      config/sources.yaml:
        fuentes:
          sales:
            archivo: train.csv
            tipo: hecho_diario
            latencia_dias: 1
            clave:
            - date
            - store_nbr
            - family
          transactions:
            archivo: transactions.csv
            tipo: hecho_diario
            latencia_dias: 2
            clave:
            - date
            - store_nbr
          oil:
            archivo: oil.csv
            tipo: hecho_diario
            latencia_dias: 1
            clave:
            - date
          holidays_events:
            archivo: holidays_events.csv
            tipo: catalogo
            cadencia_dias: 30
            anticipacion_dias: 60
            clave:
            - date
            - type
            - locale
            - locale_name
            - description
          stores:
            archivo: stores.csv
            tipo: catalogo_estatico
            clave:
            - store_nbr
        incidentes:
        - tipo: correccion_retroactiva
          fuente: sales
          fecha_datos: '2017-07-05'
          corregido_en: '2017-07-20'
          descripcion: "El POS de la tienda 44 no transmitió el 2017-07-05 y la entrega
            original reportó ceros. El dato real se reenvía 15 días después, cuando
            el pronóstico de esa semana ya fue publicado. Ejercita el INVARIANTE 4:
            la corrección se añade, no sobrescribe, y la vista vigente cambia sin
            perder lo que creíamos antes.\n"
          entrega_original:
            donde:
              store_nbr: 44
            asignar:
              sales: 0.0
        - tipo: fuente_no_llega
          fuente: transactions
          arrival_date: '2017-07-25'
          descripcion: "Caída del sistema de POS central: ese día no hay entrega y
            el archivo se acumula a la del día siguiente. Ejercita el INVARIANTE 5:
            la ausencia de una fuente es una situación de negocio y NO debe hacer
            fallar el DAG.\n"
        origen:
          kaggle_dir: data/kaggle
          landing_dir: landing
          dias_operacion: 46
          corte_historico:
    outs:
    - path: landing
      hash: md5
      md5: 637cfb90887b3d8b975900e0322bfe66.dir
      size: 126625013
      nfiles: 145
  ingesta:
    cmd: python -m reposicion ingesta --asof 2017-07-17
    deps:
    - path: landing
      hash: md5
      md5: 637cfb90887b3d8b975900e0322bfe66.dir
      size: 126625013
      nfiles: 145
    - path: src/reposicion
      hash: md5
      md5: 805db7f1decc46c00c6249c7a3a25b2c.dir
      size: 159516
      nfiles: 21
    params:
      config/pipeline.yaml:
        asof: '2017-07-17'
    outs:
    - path: data/raw
      hash: md5
      md5: b99f346bd7b0bf6a0918dfd90fca7914.dir
      size: 21956649
      nfiles: 47
  panel:
    cmd: python -m reposicion panel --asof 2017-07-17
    deps:
    - path: data/raw
