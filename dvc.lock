    params:
      config/model.yaml:
        entrenamiento:
          cadencia_origenes_dias: 7
          ventana_dias: 730
          minimo_dias_historia: 56
        features:
          ventanas:
          - 7
          - 14
          - 28
          - 56
          semanas_mismo_dia: 4
          semanas_cuantiles: 12
          dias_de_pago:
          - 15
          - ultimo
        pronostico:
          dias: 7
          dia_emision: 0
          cuantiles:
          - 0.5
          - 0.8
          - 0.9
          - 0.95
      config/pipeline.yaml:
        asof: '2017-08-14'
    outs:
    - path: data/procesado/asof=2017-08-14/entrenamiento.parquet
