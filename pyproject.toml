[project]
name = "reposicion"
version = "0.1.0"
description = "Motor de reposicion de inventario: pronostico cuantilico y pedido sugerido por tienda y familia."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "pandera>=0.20",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "typer>=0.12",
]

[project.scripts]
reposicion = "reposicion.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "dvc>=3.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reposicion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: pruebas que entrenan modelos o leen datos grandes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
